name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter code-sheriff lint
      - run: bun --filter codesheriff-cli lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit --project packages/web/tsconfig.json
      - run: bunx tsc --noEmit --project packages/cli/tsconfig.json

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter code-sheriff test
      - run: bun --filter codesheriff-cli test

  build:
    # `next build` catches compile/static-gen breaks that typecheck misses.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      GITHUB_CLIENT_ID: "dummy"
      GITHUB_CLIENT_SECRET: "dummy"
      POLAR_WEBHOOK_SECRET: "dummy"
      BETTER_AUTH_SECRET: "dummy-dummy-dummy-dummy-secret-0123456789abcdef"
      PINECONE_DB_API_KEY: "dummy"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun --filter code-sheriff build
      - run: bun --filter codesheriff-cli build
